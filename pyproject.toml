[project]
name = "us-cliffs-2017"
version = "0.1.0"
description = "National tax-benefit cliff counts under 2017 and 2025 rules, with PolicyEngine-US and Microcosm"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "policyengine-us==2.116.0",
    "policyengine-core==3.34.10",
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "tables==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "hypothesis==6.170.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cliffs2017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
